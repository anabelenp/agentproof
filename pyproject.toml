[tool.poetry]
name = "agentproof"
version = "0.1.0"
description = "Enterprise-grade AI agent testing and evaluation framework"
authors = ["Ana Bruno <aportoca@protonmail.com>"]
readme = "README.md"
packages = [{include = "agentproof", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
deepeval = "^4.0"
litellm = "^1.0"
anthropic = "^0.40"
openai = "^1.0"
qdrant-client = "^1.7"
asyncpg = "^0.30"
redis = "^5.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
httpx = "^0.27"
python-dotenv = "^1.0"
typer = "^0.12"
rich = "^13.0"
prometheus-client = "^0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-xdist = "^3.5"
pytest-cov = "^5.0"
black = "^24.0"
ruff = "^0.4"
mypy = "^1.9"
hypothesis = "^6.100"

[tool.poetry.scripts]
agentproof = "agentproof.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
python_classes = ["*Suite", "*Cases"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
